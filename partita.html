<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏀 Ponte di Nona - Live</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B00;
    --blue-dark: #003087;
    --blue-mid: #1565C0;
    --dark: #0d1b2a;
    --darker: #081422;
    --surface: #132035;
    --text: #f0f4f8;
    --text-dim: #8fa5bb;
    --foul-red: #ef5350;
    --green: #4caf50;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .container {
    width: 100%;
    max-width: 600px;
  }

  /* ─── SCOREBOARD PRINCIPALE ─── */
  .scoreboard-main {
    background: linear-gradient(135deg, var(--blue-dark) 0%, #001a5e 100%);
    border-radius: 20px;
    padding: 30px 20px;
    margin-bottom: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    border: 2px solid var(--orange);
  }

  .score-container {
    display: flex;
    align-items: center;
    justify-content: space-around;
    margin-bottom: 20px;
  }

  .team {
    text-align: center;
    flex: 1;
  }

  .team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .team.home .team-name {
    color: var(--orange);
  }

  .team.away .team-name {
    color: #64b5f6;
  }

  .score-big {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 80px;
    font-weight: 900;
    line-height: 1;
    margin-bottom: 10px;
  }

  .team.home .score-big {
    color: var(--orange);
    animation: scoreUpdate 0.5s ease-out;
  }

  .team.away .score-big {
    color: #64b5f6;
    animation: scoreUpdate 0.5s ease-out;
  }

  @keyframes scoreUpdate {
    0% {
      transform: scale(1.1);
      text-shadow: 0 0 20px rgba(255, 107, 0, 0.8);
    }
    100% {
      transform: scale(1);
      text-shadow: none;
    }
  }

  .separator {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 60px;
    font-weight: 300;
    color: var(--text-dim);
    margin: 0 10px;
  }

  .quarter-info {
    background: rgba(255, 107, 0, 0.15);
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    border: 2px solid var(--orange);
  }

  .quarter-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .quarter-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--orange);
  }

  /* ─── STORICO QUARTI ─── */
  .quarters-history {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 15px;
    flex-wrap: wrap;
  }

  .q-box {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 6px 12px;
    text-align: center;
    min-width: 60px;
  }

  .q-box-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .q-box-row {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
  }

  .q-box-h { color: var(--orange); }
  .q-box-sep { color: var(--text-dim); margin: 0 2px; }
  .q-box-a { color: #64b5f6; }

  /* ─── LAST SCORER ─── */
  .last-scorer-section {
    background: var(--surface);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    border-left: 4px solid var(--orange);
    transition: all 0.3s ease;
  }

  .last-scorer-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .last-scorer-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .scorer-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }

  .scorer-points {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--orange);
  }

  /* ─── PLAYERS SECTION ─── */
  .players-section {
    background: var(--surface);
    border-radius: 15px;
    padding: 20px;
    border-top: 3px solid var(--orange);
  }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 16px;
  }

  .player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 8px;
    margin-bottom: 8px;
    border-left: 3px solid var(--orange);
  }

  .player-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    padding-right: 10px;
  }

  .player-stats {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .player-breakdown {
    display: flex;
    gap: 4px;
  }

  .pt-pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-dim);
    padding: 2px 5px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    white-space: nowrap;
  }

  .player-pts {
    background: var(--orange);
    color: white;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 900;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* STILI APPLICATI E OTTIMIZZATI PER I FALLI SINGOLI */
  .player-fouls {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .player-fouls.f-zero {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-dim);
  }

  .player-fouls.f-active {
    background: rgba(239, 83, 80, 0.2);
    color: var(--foul-red);
  }

  .player-fouls.f-danger {
    background: var(--foul-red);
    color: white;
  }

  /* ─── NO DATA ─── */
  .no-data {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  .loading {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .loading::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }

  /* ─── FIREBASE STATUS ─── */
  .firebase-status {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #4caf50;
    box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
    z-index: 999;
  }

  .firebase-status.offline {
    background: #ff9800;
    animation: blink-offline 0.5s infinite;
  }

  @keyframes blink-offline {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 480px) {
    .scoreboard-main {
      padding: 20px 15px;
    }

    .score-big {
      font-size: 60px;
    }

    .separator {
      font-size: 45px;
    }

    .pt-pill {
      font-size: 10px;
      padding: 1px 3px;
    }
  }
</style>
</head>
<body>

<script>
console.log("Pagina partita.html caricata");
</script>
  
<div class="firebase-status" id="firebaseStatus"></div>

<div class="container">
  <div id="noDataView" class="no-data">
    <div class="loading">Connessione in corso</div>
  </div>

  <div id="mainView" style="display: none;">
    <div class="scoreboard-main">
      <div class="score-container">
        <div class="team home">
          <div class="team-name" id="homeTeamName">PONTE</div>
          <div class="score-big" id="homeScore">0</div>
        </div>
        <div class="separator">—</div>
        <div class="team away">
          <div class="team-name" id="awayTeamName">AVV</div>
          <div class="score-big" id="awayScore">0</div>
        </div>
      </div>

      <div class="quarter-info">
        <div class="quarter-label">Quarto</div>
        <div class="quarter-number" id="quarterNumber">1</div>
      </div>

      <div class="quarters-history" id="quartersHistoryContainer" style="display: none;"></div>
    </div>

    <div class="last-scorer-section" id="lastScorerSection" style="display: none;">
      <div class="last-scorer-label" id="lastScorerLabel">⭐ Ultimo marcatore</div>
      <div class="last-scorer-info">
        <div class="scorer-name" id="lastScorerName">-</div>
        <div class="scorer-points" id="lastScorerPoints">0</div>
      </div>
    </div>

    <div class="players-section">
      <div class="section-title">👥 Convocati</div>
      <div id="playersList"></div>
    </div>
  </div>
</div>

<script type="module">
console.log("Inizio caricamento Firebase");

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

console.log("Firebase SDK importato");

const firebaseConfig = {
  apiKey: "AIzaSyAtkWH5ekxU7YK-LvXLR0hhb-cyrFmxc34",
  authDomain: "basket-scoresheet.firebaseapp.com",
  projectId: "basket-scoresheet",
  storageBucket: "basket-scoresheet.firebasestorage.app",
  messagingSenderId: "239574167542",
  appId: "1:239574167542:web:abcd8f2a2d62fa132061d7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

console.log("Firebase inizializzato");

const docRef = doc(db, "matches", "current");

// Variabili globali di stato per intercettare i canestri in tempo reale
let lastHomeScore = 0;
let prevHomeScore = null;
let prevAwayScore = null;
let prevPlayersState = null;
let currentNotification = JSON.parse(localStorage.getItem('live_last_notification') || 'null');

console.log("Inizio ascolto Firestore...");

const unsubscribe = onSnapshot(
  docRef,
  (docSnap) => {
    console.log("Snapshot ricevuto", docSnap.exists());
    if (docSnap.exists()) {
      const data = docSnap.data();
      console.log("Dati Firestore:", data);
      
      // Analizza le variazioni per calcolare la notifica canestro
      detectChanges(data);
      
      updateUI(data);
      updateFirebaseStatus(true);
    } else {
      console.log("Documento non esiste");
      document.getElementById('noDataView').style.display = 'block';
      document.getElementById('mainView').style.display = 'none';
    }
  },
  (error) => {
    console.error('Errore Firestore:', error);
    updateFirebaseStatus(false);
  }
);

function updateFirebaseStatus(online) {
  const status = document.getElementById('firebaseStatus');
  if (online) {
    status.classList.remove('offline');
  } else {
    status.classList.add('offline');
  }
}

function detectChanges(data) {
  const homeScore = data.homeScore || 0;
  const awayScore = data.awayScore || 0;
  const homeTeam = data.homeTeam || 'PONTE';
  const awayTeam = data.awayTeam || 'AVV';
  const players = data.players || [];

  if (prevHomeScore === null || prevAwayScore === null || prevPlayersState === null) {
    prevHomeScore = homeScore;
    prevAwayScore = awayScore;
    prevPlayersState = {};
    players.forEach(p => {
      const pts = (p.pt1 || 0) + (p.pt2 || 0) * 2 + (p.pt3 || 0) * 3;
      prevPlayersState[p.name] = pts;
    });
    return;
  }

  if (homeScore > prevHomeScore) {
    const delta = homeScore - prevHomeScore;
    let scorerName = homeTeam;
    let pointText = '+' + delta;

    for (let p of players) {
      const currentPts = (p.pt1 || 0) + (p.pt2 || 0) * 2 + (p.pt3 || 0) * 3;
      const prevPts = prevPlayersState[p.name] || 0;
      if (currentPts > prevPts) {
        scorerName = p.name;
        pointText = '+' + (currentPts - prevPts);
        break;
      }
    }

    currentNotification = {
      team: 'home',
      name: scorerName,
      text: pointText
    };
    localStorage.setItem('live_last_notification', JSON.stringify(currentNotification));
  }
  else if (awayScore > prevAwayScore) {
    const delta = awayScore - prevAwayScore;
    currentNotification = {
      team: 'away',
      name: awayTeam,
      text: '+' + delta
    };
    localStorage.setItem('live_last_notification', JSON.stringify(currentNotification));
  }
  else if (homeScore < prevHomeScore || awayScore < prevAwayScore) {
    currentNotification = null;
    localStorage.removeItem('live_last_notification');
  }

  prevHomeScore = homeScore;
  prevAwayScore = awayScore;
  prevPlayersState = {};
  players.forEach(p => {
    const pts = (p.pt1 || 0) + (p.pt2 || 0) * 2 + (p.pt3 || 0) * 3;
    prevPlayersState[p.name] = pts;
  });
}

function updateUI(data) {
  const {
    homeTeam = 'PONTE',
    awayTeam = 'AVV',
    homeScore = 0,
    awayScore = 0,
    quarter = 1,
    quarterHistory = [],
    players = []
  } = data;

  // Aggiorna nomi squadre
  document.getElementById('homeTeamName').textContent = homeTeam || 'PONTE';
  document.getElementById('awayTeamName').textContent = awayTeam || 'AVV';
  
  // Animazione del punteggio di casa
  const homeScoreEl = document.getElementById('homeScore');
  if (homeScore !== lastHomeScore) {
    homeScoreEl.style.animation = 'none';
    setTimeout(() => {
      homeScoreEl.style.animation = 'scoreUpdate 0.5s ease-out';
      homeScoreEl.textContent = homeScore;
      lastHomeScore = homeScore;
    }, 10);
  } else {
    homeScoreEl.textContent = homeScore;
  }

  document.getElementById('awayScore').textContent = awayScore;
  document.getElementById('quarterNumber').textContent = quarter;

  // Rendering Storico Quarti
  const qContainer = document.getElementById('quartersHistoryContainer');
  qContainer.innerHTML = '';
  if (quarterHistory && quarterHistory.length > 0) {
    quarterHistory.forEach((entry) => {
      const box = document.createElement('div');
      box.className = 'q-box';
      box.innerHTML = `
        <div class="q-box-label">Q${entry.q}</div>
        <div class="q-box-row">
          <span class="q-box-h">${entry.home}</span>
          <span class="q-box-sep">-</span>
          <span class="q-box-a">${entry.away}</span>
        </div>
      `;
      qContainer.appendChild(box);
    });
    qContainer.style.display = 'flex';
  } else {
    qContainer.style.display = 'none';
  }

  // Elabora i convocati attivi
  const activePlayers_list = [];
  players.forEach((p) => {
    if (p.active) {
      activePlayers_list.push(p);
    }
  });

  // Rendering Notifica di canestro in real-time
  const lastScorerSection = document.getElementById('lastScorerSection');
  const pointsEl = document.getElementById('lastScorerPoints');
  const labelEl = document.getElementById('lastScorerLabel');

  if (currentNotification) {
    lastScorerSection.style.display = 'block';
    document.getElementById('lastScorerName').textContent = currentNotification.name;
    pointsEl.textContent = currentNotification.text;
    
    if (currentNotification.team === 'away') {
      lastScorerSection.style.borderLeft = '4px solid #64b5f6';
      pointsEl.style.color = '#64b5f6';
      labelEl.textContent = '⚡ Canestro avversario';
    } else {
      lastScorerSection.style.borderLeft = '4px solid var(--orange)';
      pointsEl.style.color = 'var(--orange)';
      labelEl.textContent = '⭐ Ultimo marcatore';
    }
  } else {
    let topScorer = null;
    let maxPts = 0;
    players.forEach((p) => {
      const pts = (p.pt1 || 0) + (p.pt2 || 0) * 2 + (p.pt3 || 0) * 3;
      if (pts > maxPts) {
        maxPts = pts;
        topScorer = p.name;
      }
    });

    if (topScorer && maxPts > 0) {
      lastScorerSection.style.display = 'block';
      document.getElementById('lastScorerName').textContent = topScorer;
      pointsEl.textContent = maxPts;
      pointsEl.style.color = 'var(--orange)';
      lastScorerSection.style.borderLeft = '4px solid var(--orange)';
      labelEl.textContent = '⭐ Miglior marcatore';
    } else {
      lastScorerSection.style.display = 'none';
    }
  }

  // Genera la lista dei Convocati con dettaglio punti e FALLI SINGOLI AGGIUNTI
  const playersList = document.getElementById('playersList');
  playersList.innerHTML = '';

  activePlayers_list.forEach((p) => {
    const pts = (p.pt1 || 0) + (p.pt2 || 0) * 2 + (p.pt3 || 0) * 3;
    const fouls = p.fouls || 0;

    // Assegna la classe colore corretta in base al numero di falli commessi
    const foulClass = fouls >= 4 ? 'f-danger' : (fouls > 0 ? 'f-active' : 'f-zero');

    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `
      <div class="player-name">${p.name}</div>
      <div class="player-stats">
        <div class="player-breakdown">
          <span class="pt-pill">1p: ${p.pt1 || 0}</span>
          <span class="pt-pill">2p: ${p.pt2 || 0}</span>
          <span class="pt-pill">3p: ${p.pt3 || 0}</span>
        </div>
        <div class="player-pts">${pts}</div>
        <div class="player-fouls ${foulClass}">${fouls}</div>
      </div>
    `;
    playersList.appendChild(row);
  });

  // Mostra la view principale
  document.getElementById('noDataView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
}

// Gestisci errori di connessione internet
window.addEventListener('offline', () => updateFirebaseStatus(false));
window.addEventListener('online', () => updateFirebaseStatus(true));

console.log("Script Firebase partita.html completato");
</script>

</body>
</html>
